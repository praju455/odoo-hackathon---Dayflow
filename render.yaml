services:
  # ── Backend Web Service ────────────────────────────────────────────────────
  - type: web
    name: dayflow-backend
    runtime: node
    region: singapore          # closest to India
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true     # Render auto-generates a secure random secret
      - key: DATABASE_URL
        fromDatabase:
          name: dayflow-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://frontend-omega-flax-56.vercel.app

  # ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: dayflow-db
    region: singapore
    plan: free
    databaseName: dayflow
    user: dayflow
